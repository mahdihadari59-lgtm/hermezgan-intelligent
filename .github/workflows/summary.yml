name: Auto-summarize Issues

on:
  issues:
    types: [opened]

jobs:
  summarize:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate issue summary using GitHub Copilot
        id: copilot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          # اگر Copilot API موجود است، استفاده کنید
          # در غیر اینصورت، خلاصه ساده تر استفاده شود
          
          BODY="${ISSUE_BODY:-No description}"
          SUMMARY="**🤖 Automated Summary:**\n\n"
          SUMMARY+="**Title:** ${ISSUE_TITLE}\n\n"
          SUMMARY+="**Type:** $(echo "$ISSUE_BODY" | grep -o 'bug\|feature\|enhancement\|documentation' | head -1 || echo 'General')\n\n"
          
          echo "summary<<EOF" >> $GITHUB_OUTPUT
          echo "$SUMMARY" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Comment with summary
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue_number = context.issue.number;
            const summary = `${{ steps.copilot.outputs.summary }}`;
            
            if (!summary || summary.trim() === '') {
              console.log('Skip: Empty summary');
              return;
            }
            
            github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: issue_number,
              body: summary
            });

      - name: Add label if needed
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const issue = context.payload.issue;
            const isBug = issue.title.toLowerCase().includes('bug') || 
                         issue.body.toLowerCase().includes('bug');
            const isFeature = issue.title.toLowerCase().includes('feature') || 
                             issue.body.toLowerCase().includes('feature');
            
            const labels = [];
            if (isBug) labels.push('bug');
            if (isFeature) labels.push('enhancement');
            if (labels.length === 0) labels.push('triage-needed');
            
            if (labels.length > 0) {
              github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: labels
              });
            }
